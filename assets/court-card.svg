<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="stad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1730"/>
      <stop offset="0.55" stop-color="#0b1c3a"/>
      <stop offset="1" stop-color="#08101f"/>
    </linearGradient>
    <linearGradient id="surf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f86e8"/>
      <stop offset="1" stop-color="#225fc0"/>
    </linearGradient>
    <linearGradient id="runoff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173f7e"/>
      <stop offset="1" stop-color="#102f63"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9fd0ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mesh" width="4" height="3.4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4M0 0V3.4" stroke="#cfe0f5" stroke-width="0.35" stroke-opacity="0.5" fill="none"/>
    </pattern>
    <radialGradient id="spot" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#3768b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3768b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- estadio -->
  <rect width="320" height="180" fill="url(#stad)"/>
  <rect width="320" height="180" fill="url(#spot)"/>

  <!-- público (filas tenues detrás del fondo) -->
  <g fill="#24365c" opacity="0.55">
    <rect x="60" y="14" width="200" height="3" rx="1.5"/>
    <rect x="52" y="20" width="216" height="3" rx="1.5"/>
    <rect x="44" y="26" width="232" height="3" rx="1.5"/>
  </g>
  <!-- luces -->
  <circle cx="70" cy="9" r="2" fill="#dceaff" opacity="0.85"/>
  <circle cx="160" cy="6" r="2.4" fill="#eaf3ff"/>
  <circle cx="250" cy="9" r="2" fill="#dceaff" opacity="0.85"/>

  <!-- paredes laterales de cristal -->
  <polygon points="20,168 104,50 104,34 20,150" fill="url(#glass)" stroke="#5e86c2" stroke-width="0.5" stroke-opacity="0.6"/>
  <polygon points="300,168 216,50 216,34 300,150" fill="url(#glass)" stroke="#5e86c2" stroke-width="0.5" stroke-opacity="0.6"/>
  <!-- pared de cristal del fondo -->
  <polygon points="104,50 216,50 216,30 104,30" fill="url(#glass)" stroke="#6e94cf" stroke-width="0.7" stroke-opacity="0.7"/>
  <line x1="160" y1="30" x2="160" y2="50" stroke="#6e94cf" stroke-width="0.5" stroke-opacity="0.5"/>

  <!-- piso: run-off + cancha -->
  <polygon points="104,50 216,50 300,168 20,168" fill="url(#runoff)"/>
  <polygon points="120,58 200,58 280,166 40,166" fill="url(#surf)"/>
  <polygon points="120,58 200,58 280,166 40,166" fill="url(#sheen)"/>

  <!-- líneas reglamentarias -->
  <g stroke="#eef4ff" fill="none" stroke-linecap="round" stroke-opacity="0.95">
    <polygon points="120,58 200,58 280,166 40,166" stroke-width="1.7"/>
    <line x1="108.5" y1="73"  x2="211.5" y2="73"  stroke-width="1.4"/>
    <line x1="52"    y1="148" x2="268"   y2="148" stroke-width="1.6"/>
    <line x1="160"   y1="73"  x2="160"   y2="148" stroke-width="1.4"/>
  </g>

  <!-- RED -->
  <g>
    <!-- cuerpo de malla -->
    <path d="M82,107 Q160,103 238,107 L238,113 Q160,118 82,113 Z" fill="#0c1b35" fill-opacity="0.55"/>
    <path d="M82,107 Q160,103 238,107 L238,113 Q160,118 82,113 Z" fill="url(#mesh)"/>
    <!-- cinta blanca superior -->
    <path d="M82,107 Q160,103 238,107" stroke="#ffffff" stroke-width="2" fill="none"/>
    <!-- tensor central -->
    <line x1="160" y1="105" x2="160" y2="117" stroke="#ffffff" stroke-width="1.4"/>
    <!-- postes -->
    <line x1="82"  y1="104" x2="82"  y2="115" stroke="#d7e2f2" stroke-width="1.8"/>
    <line x1="238" y1="104" x2="238" y2="115" stroke="#d7e2f2" stroke-width="1.8"/>
  </g>

  <!-- pelotas -->
  <circle cx="206" cy="128" r="3.8" fill="#e9ff3d"/>
  <circle cx="116" cy="150" r="3" fill="#e9ff3d"/>
</svg>
