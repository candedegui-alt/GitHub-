<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="stad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2247"/>
      <stop offset="1" stop-color="#091022"/>
    </linearGradient>
    <linearGradient id="surf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b86f0"/>
      <stop offset="1" stop-color="#1f5bc4"/>
    </linearGradient>
    <linearGradient id="run" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4ea3"/>
      <stop offset="1" stop-color="#123a82"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#2c5aa8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2c5aa8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="180" fill="url(#stad)"/>
  <rect width="320" height="180" fill="url(#glow)"/>

  <!-- luces de estadio -->
  <circle cx="70" cy="12" r="2" fill="#d7e6ff" opacity="0.7"/>
  <circle cx="160" cy="9" r="2.4" fill="#d7e6ff" opacity="0.85"/>
  <circle cx="250" cy="12" r="2" fill="#d7e6ff" opacity="0.7"/>

  <!-- run-off exterior -->
  <polygon points="116,40 204,40 312,172 8,172" fill="url(#run)"/>
  <!-- superficie -->
  <polygon points="124,44 196,44 296,170 24,170" fill="url(#surf)"/>

  <!-- líneas -->
  <g stroke="#f1f6ff" stroke-width="1.5" fill="none" opacity="0.95">
    <line x1="124" y1="44" x2="196" y2="44"/>
    <line x1="24" y1="170" x2="296" y2="170"/>
    <line x1="124" y1="44" x2="24" y2="170"/>
    <line x1="196" y1="44" x2="296" y2="170"/>
    <line x1="142" y1="78" x2="178" y2="78"/>
    <line x1="86" y1="140" x2="234" y2="140"/>
    <line x1="160" y1="78" x2="160" y2="140"/>
  </g>

  <!-- red -->
  <g>
    <line x1="74" y1="108" x2="246" y2="108" stroke="#e7eefc" stroke-width="2.4"/>
    <line x1="74" y1="108" x2="246" y2="108" stroke="#0a1428" stroke-width="0.5"/>
  </g>

  <!-- pelotas -->
  <circle cx="205" cy="125" r="4" fill="#e9ff3d"/>
  <circle cx="120" cy="150" r="3.4" fill="#e9ff3d"/>
  <circle cx="168" cy="96" r="2.6" fill="#e9ff3d"/>
</svg>
